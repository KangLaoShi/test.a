<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSRE Dashboard - Private Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --brand-green: #2C5F56;
            --brand-mint: #F1F8F6;
            --brand-yellow: #FFC554;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: var(--brand-mint);
            color: #1A2E35;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #D1DEDC; border-radius: 10px; }

        .card-modern {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 4px 20px -2px rgba(44, 95, 86, 0.04);
            border: 1px solid rgba(255, 255, 255, 1);
        }

        .btn-active:active { transform: scale(0.95); }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(44, 95, 86, 0.08); }

        .filter-chip.active { 
            background: var(--brand-green); 
            color: white; 
            box-shadow: 0 10px 15px -3px rgba(44, 95, 86, 0.2);
            border-color: var(--brand-green);
        }
        
        .lang-item.active { background-color: var(--brand-green); color: white; font-weight: 800; }

        .pin-mask { -webkit-text-security: disc; }

        .bg-mesh {
            background-color: var(--brand-mint);
            background-image: radial-gradient(at 0% 0%, rgba(44, 95, 86, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 0%, rgba(255, 197, 84, 0.03) 0px, transparent 50%);
        }

        .table-row-modern:hover { background-color: rgba(44, 95, 86, 0.04); transform: translateX(4px); }
        .table-row-modern { transition: transform 0.2s ease, background-color 0.2s ease; }
    </style>
</head>
<body class="bg-mesh min-h-screen">
    
    <div id="entry-gate" class="fixed inset-0 z-[500] flex items-center justify-center p-4 bg-[#1A2E35]">
        <div class="absolute inset-0 opacity-10" style="background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');"></div>
        <div class="bg-white rounded-[40px] shadow-2xl w-full max-w-md p-12 text-center relative z-10 border-t-8 border-[#2C5F56]">
            <div class="mb-8 text-center">
                <img src="./logo.png" alt="Logo" class="h-16 w-auto mx-auto object-contain drop-shadow-md" onerror="this.style.display='none'; document.getElementById('logo-fallback').classList.remove('hidden');" />
                <div id="logo-fallback" class="hidden w-20 h-20 bg-[#2C5F56] rounded-[28px] mx-auto flex items-center justify-center shadow-2xl">
                    <span class="text-white font-black text-2xl italic">NS</span>
                </div>
            </div>
            <h2 id="portal-title" class="text-2xl font-[800] text-[#1A2E35] mb-2 tracking-tight">内部教学记录系统</h2>
            <p id="portal-subtitle" class="text-[#2C5F56] font-bold mb-10 text-xs uppercase tracking-[0.2em]">私有教学管理面板</p>
            
            <div id="auth-container" class="space-y-5 text-left mb-6">
                <div><input id="entry-name" type="text" class="w-full px-6 py-5 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none focus:ring-2 focus:ring-[#2C5F56]/10" placeholder="教师姓名 (例如: Kanglaoshi)"></div>
                <div><input id="entry-pin" type="text" class="w-full px-6 py-5 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none focus:ring-2 focus:ring-[#2C5F56]/10 pin-mask" placeholder="访问识别码 (PIN)"></div>
                <button id="btn-enter" class="w-full bg-[#2C5F56] text-white py-5 rounded-3xl font-bold shadow-xl hover:opacity-90 active:scale-[0.98] transition-all mt-2 text-sm">进入工作台</button>
            </div>

            <div class="flex justify-center gap-3 border-t border-slate-50 pt-6">
                <button onclick="setLang('zh')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">ZH</button>
                <button onclick="setLang('uz')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">UZ</button>
                <button onclick="setLang('ru')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">RU</button>
                <button onclick="setLang('en')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">EN</button>
            </div>
            <p id="auth-error" class="text-rose-500 text-xs font-bold mt-6 hidden">识别码错误，请重新输入。</p>
        </div>
    </div>

    <div id="app-content" class="max-w-[1440px] mx-auto p-4 md:p-8 hidden">
        <header class="relative z-[100] flex flex-col lg:flex-row lg:items-center justify-between mb-10 gap-6 bg-white/50 p-6 rounded-[32px] border border-white shadow-sm backdrop-blur-md">
            <div class="flex flex-col">
                <h1 id="page-title-main" class="text-2xl md:text-3xl font-[900] text-[#1A2E35]">学生付费跟进管理</h1>
                <p id="page-subtitle" class="text-[#2C5F56]/50 font-bold text-[10px] uppercase tracking-[0.2em] mt-1">协作版 · 实时云同步</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <div class="relative group">
                    <button class="flex items-center gap-2 bg-white px-5 h-[52px] rounded-full text-[#1A2E35] border border-[#D1DEDC] font-bold text-[10px] uppercase tracking-widest">
                        <i data-lucide="globe" class="w-3.5 h-3.5 text-[#2C5F56]"></i>
                        <span id="current-lang-text">ZH</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 text-slate-300"></i>
                    </button>
                    <div class="absolute right-0 mt-2 w-44 bg-white border border-[#D1DEDC] rounded-[24px] shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-[150] overflow-hidden p-2">
                        <button onclick="setLang('zh')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors mb-1">中文 (ZH)</button>
                        <button onclick="setLang('uz')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors mb-1">O'zbek (UZ)</button>
                        <button onclick="setLang('ru')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors mb-1">Русский (RU)</button>
                        <button onclick="setLang('en')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors">English (EN)</button>
                    </div>
                </div>
                <div class="flex items-center gap-3 bg-[#1A2E35] px-5 h-[52px] rounded-full shadow-lg">
                    <div class="w-8 h-8 bg-[#FFC554] text-[#1A2E35] rounded-lg flex items-center justify-center font-black text-[10px]" id="user-avatar">?</div>
                    <span id="logged-user-name" class="text-[11px] font-bold text-white tracking-tight">---</span>
                    <button onclick="logout()" class="ml-1 text-slate-500 hover:text-rose-400 transition-colors"><i data-lucide="power" class="w-3.5 h-3.5"></i></button>
                </div>
                <button onclick="openAddModal()" class="btn-active flex items-center gap-2 bg-[#2C5F56] text-white px-6 h-[52px] rounded-full shadow-xl shadow-[#2C5F56]/20 font-bold text-xs">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i><span id="add-btn-text">添加学生</span>
                </button>
            </div>
        </header>

        <main class="space-y-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">
                <div onclick="setStatusFilter('all')" class="card-modern p-6 flex items-center gap-6 hover-lift border-l-8 border-[#2C5F56] cursor-pointer transition-all active:scale-95" title="点击查看所有活跃学生">
                    <div class="w-14 h-14 bg-[#F0F6F5] text-[#2C5F56] rounded-2xl flex items-center justify-center"><i data-lucide="users-2" class="w-6 h-6"></i></div>
                    <div><p id="stat-total-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">在读总数</p><p id="stat-total-val" class="text-3xl font-[900] text-[#1A2E35]">0</p></div>
                </div>
                <div onclick="setStatusFilter('warning')" class="card-modern p-6 flex items-center gap-6 hover-lift border-l-8 border-[#FFC554] cursor-pointer transition-all active:scale-95" title="点击筛选即将到期">
                    <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center"><i data-lucide="hourglass" class="w-6 h-6"></i></div>
                    <div><p id="stat-warning-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">即将到期</p><p id="stat-warning-val" class="text-3xl font-[900] text-[#1A2E35]">0</p></div>
                </div>
                <div onclick="setStatusFilter('overdue')" class="card-modern p-6 flex items-center gap-6 hover-lift border-l-8 border-rose-500 cursor-pointer transition-all active:scale-95" title="点击筛选欠费学生">
                    <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center"><i data-lucide="alert-octagon" class="w-6 h-6"></i></div>
                    <div><p id="stat-overdue-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">欠费预警</p><p id="stat-overdue-val" class="text-3xl font-[900] text-rose-500">0</p></div>
                </div>
                <div onclick="setStatusFilter('frozen')" class="card-modern p-6 flex items-center gap-6 hover-lift border-l-8 border-blue-500 cursor-pointer transition-all active:scale-95" title="点击筛选冻结学生">
                    <div class="w-14 h-14 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center"><i data-lucide="snowflake" class="w-6 h-6"></i></div>
                    <div><p id="stat-frozen-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">冻结账户</p><p id="stat-frozen-val" class="text-3xl font-[900] text-blue-500">0</p></div>
                </div>
                <div onclick="setStatusFilter('archived')" class="card-modern p-6 flex items-center gap-6 hover-lift border-l-8 border-slate-500 cursor-pointer transition-all active:scale-95" title="点击筛选停学学生">
                    <div class="w-14 h-14 bg-slate-100 text-slate-500 rounded-2xl flex items-center justify-center"><i data-lucide="archive" class="w-6 h-6"></i></div>
                    <div><p id="stat-archived-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">停学归档</p><p id="stat-archived-val" class="text-3xl font-[900] text-slate-500">0</p></div>
                </div>
            </div>

            <div class="card-modern p-5 space-y-2">
                <div id="teacher-filter-wrap" class="hidden flex flex-col gap-1.5">
                    <span id="filter-label" class="text-[9px] font-black text-[#2C5F56]/40 uppercase ml-2">负责人:</span>
                    <div id="teacher-filter-container" class="flex flex-wrap gap-1.5"></div>
                </div>
                <div id="class-filter-wrap" class="flex flex-col gap-1.5 pt-3 border-t border-slate-50">
                    <span id="filter-class-label" class="text-[9px] font-black text-[#2C5F56]/40 uppercase ml-2">班级筛选:</span>
                    <div id="class-filter-container" class="flex flex-wrap gap-1.5"></div>
                </div>
                <div id="status-filter-wrap" class="flex flex-col gap-1.5 pt-3 border-t border-slate-50">
                    <span id="filter-status-label" class="text-[9px] font-black text-[#2C5F56]/40 uppercase ml-2">状态筛选:</span>
                    <div id="status-filter-container" class="flex flex-wrap gap-1.5"></div>
                </div>
            </div>

            <div class="card-modern overflow-hidden shadow-xl">
                <div class="overflow-x-auto min-h-[400px]">
                    <table class="w-full text-left whitespace-nowrap">
                        <thead class="bg-[#F7FAF9]/80 border-b border-slate-100">
                            <tr id="table-head-row"></tr>
                        </thead>
                        <tbody id="student-table-body" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit/Add Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-[#1A2E35]/90 backdrop-blur-lg hidden items-center justify-center p-4 z-[600]">
        <div class="bg-white rounded-[40px] shadow-2xl w-full max-w-md p-10 overflow-y-auto max-h-[90vh] border-t-8 border-[#FFC554]">
            <div class="flex justify-between items-center mb-10">
                <h3 id="modal-title" class="text-2xl font-[900]">编辑信息</h3>
                <button onclick="toggleModal(false)" class="p-3 text-slate-300 hover:text-rose-500"><i data-lucide="x"></i></button>
            </div>
            <form id="student-form" class="space-y-6 text-left">
                <input type="hidden" id="input-id">
                <div><label id="label-name" class="text-[10px] font-black text-slate-300 uppercase ml-4">姓名</label>
                <input id="input-name" type="text" required class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none" placeholder="输入姓名"></div>
                <div><label id="label-contract" class="text-[10px] font-black text-slate-300 uppercase ml-4">合同号</label>
                <input id="input-contract" type="text" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none" placeholder="输入号"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label id="label-teacher" class="text-[10px] font-black text-slate-300 uppercase ml-4">负责老师</label>
                    <select id="input-teacher" required class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none appearance-none"></select></div>
                    <div><label id="label-class" class="text-[10px] font-black text-slate-300 uppercase ml-4">班级</label>
                    <input id="input-class" list="class-list" type="text" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none outline-none" placeholder="选择或输入"></div>
                </div>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div><label id="label-total" class="text-[10px] font-black text-slate-300 uppercase">总量</label>
                    <select id="input-total" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none outline-none text-center"></select></div>
                    <div><label id="label-used" class="text-[10px] font-black text-slate-300 uppercase">已上</label>
                    <input id="input-used" type="number" required class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none outline-none text-center"></div>
                </div>
                <div><label id="label-date" class="text-[10px] font-black text-slate-300 uppercase ml-4">付费日期</label>
                <input id="input-date" type="date" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none outline-none"></div>
                <div class="flex gap-4 pt-6">
                    <button type="button" onclick="toggleModal(false)" id="btn-cancel" class="flex-1 py-4 font-black text-slate-400">取消</button>
                    <button type="submit" id="btn-save" class="flex-1 py-4 bg-[#2C5F56] text-white rounded-3xl font-black">保存</button>
                </div>
            </form>
            <datalist id="class-list"></datalist>
        </div>
    </div>

    <!-- Note Modal -->
    <div id="note-modal-overlay" class="fixed inset-0 bg-[#1A2E35]/90 backdrop-blur-lg hidden items-center justify-center p-4 z-[750]">
        <div class="bg-white rounded-[40px] shadow-2xl w-full max-w-md p-10 flex flex-col border-t-8 border-[#2C5F56]">
            <div class="flex justify-between items-center mb-6">
                <h3 id="note-modal-title" class="text-2xl font-[900] text-[#1A2E35]">学生备注</h3>
                <button onclick="toggleNoteModal(false)" class="p-3 bg-slate-50 rounded-full text-slate-400 hover:text-rose-500 transition-colors"><i data-lucide="x"></i></button>
            </div>
            <div class="mb-4">
                <p id="note-student-name" class="text-sm font-bold text-[#2C5F56] mb-2"></p>
                <textarea id="student-note-input" rows="5" class="w-full p-5 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none resize-none text-sm text-[#1A2E35]" placeholder="输入学员备注..."></textarea>
            </div>
            <div class="flex gap-4 pt-2">
                <button onclick="toggleNoteModal(false)" id="note-btn-cancel" class="flex-1 py-4 font-black text-slate-400 bg-slate-50 rounded-3xl">取消</button>
                <button onclick="saveStudentNote()" id="note-btn-save" class="flex-1 py-4 bg-[#2C5F56] text-white rounded-3xl font-black shadow-lg shadow-[#2C5F56]/20">保存备注</button>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal-overlay" class="fixed inset-0 bg-[#1A2E35]/95 backdrop-blur-xl hidden items-center justify-center p-4 z-[700]">
        <div class="bg-white rounded-[40px] shadow-2xl w-full max-w-md p-12 flex flex-col max-h-[90vh] border-t-8 border-[#FFC554]">
            <div class="flex justify-between items-start mb-8 shrink-0">
                <div class="flex flex-col gap-2">
                    <h3 id="history-modal-title" class="text-2xl font-[900] text-[#1A2E35] tracking-tight">上课记录</h3>
                    <div id="history-contract-container" class="hidden flex items-center gap-2">
                        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-widest bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200" id="history-contract-display"></span>
                        <button onclick="copyContractNumber()" id="btn-copy-contract" class="p-1.5 bg-white border border-slate-200 text-slate-400 hover:text-[#2C5F56] hover:border-[#2C5F56] rounded-lg transition-all shadow-sm flex items-center justify-center">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
                <button onclick="toggleHistoryModal(false)" class="p-3 bg-slate-50 rounded-full text-slate-400 hover:text-rose-500 transition-colors"><i data-lucide="x"></i></button>
            </div>
            <div class="flex gap-3 mb-8 shrink-0">
                <input type="date" id="manual-date-input" class="flex-1 px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none outline-none">
                <button onclick="handleRecordAction()" id="btn-record-action" class="px-8 py-4 bg-[#2C5F56] text-white rounded-3xl font-black transition-all hover:opacity-90">补签</button>
                <button onclick="cancelRecordEdit()" id="btn-record-cancel" class="hidden px-4 py-4 bg-rose-50 text-rose-500 font-bold rounded-2xl transition-all hover:bg-rose-100">✕</button>
            </div>
            <div id="history-list" class="space-y-4 overflow-y-auto pr-2 no-scrollbar flex-1 mb-8 min-h-[200px]"></div>
            <button onclick="toggleHistoryModal(false)" id="btn-close-history" class="w-full py-5 bg-[#F7FAF9] text-slate-400 rounded-3xl font-black transition-all hover:bg-slate-100">关闭窗口</button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal-overlay" class="fixed inset-0 bg-[#1A2E35]/95 backdrop-blur-xl hidden items-center justify-center p-4 z-[999]">
        <div class="bg-white rounded-[32px] p-8 text-center border-t-8 border-rose-500 w-full max-w-sm">
            <h3 id="confirm-modal-title" class="text-xl font-[900] mb-2">确认操作</h3>
            <p id="confirm-modal-msg" class="text-slate-400 text-sm mb-8"></p>
            <div class="flex gap-4">
                <button id="confirm-btn-cancel" class="flex-1 py-4 font-black text-slate-400 bg-slate-50 rounded-2xl">取消</button>
                <button id="confirm-btn-ok" class="flex-1 py-4 bg-rose-500 text-white rounded-2xl font-black shadow-lg shadow-rose-500/20">确认</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, updateDoc, deleteDoc, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const defaultFirebaseConfig = { apiKey: "AIzaSyDsuB8A4RBJz3PlDvzAEhKA3FEDoDmFfh8", authDomain: "studenttracker-a8384.firebaseapp.com", projectId: "studenttracker-a8384", storageBucket: "studenttracker-a8384.firebasestorage.app", messagingSenderId: "181463996376", appId: "1:181463996376:web:77b32e8a82a63c5eb004ad" };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-tracker';
        
        const teacherList = ["Kanglaoshi", "Pailaoshi", "Alaoshi", "Tielaoshi", "Lanyinglaoshi", "Tanglaoshi"];
        const teacherPins = { "Director": "1234", "Kanglaoshi": "1234", "Pailaoshi": "1234", "Alaoshi": "1234", "Tielaoshi": "1234", "Lanyinglaoshi": "1234", "Tanglaoshi": "1234" };

        let currentLang = 'zh', selectedTeacher = 'all', selectedClass = 'all', selectedStatus = 'all';
        let students = [], loggedUser = null, isAdmin = false;
        let currentHistoryStudentId = null, editingRecordIndex = -1, currentNoteStudentId = null;
        let db, auth;

        const tDict = {
            zh: { 
                portalTitle: "内部教学记录系统", portalSub: "私有教学管理面板", entryName: "教师姓名", entryPin: "访问识别码 (PIN)", btnEnter: "进入工作台", errPin: "识别码错误",

        const customConfirm = (msg, callback) => {
            const overlay = document.getElementById('confirm-modal-overlay');
            const t = tDict[currentLang] || tDict['zh'];
            document.getElementById('confirm-modal-title').innerText = t.confirmTitle;
            document.getElementById('confirm-modal-msg').innerText = msg;
            overlay.style.display = 'flex';
            document.getElementById('confirm-btn-ok').innerText = t.btnOk;
            document.getElementById('confirm-btn-cancel').innerText = t.btnAbort;
            document.getElementById('confirm-btn-ok').onclick = () => { callback(); overlay.style.display = 'none'; };
            document.getElementById('confirm-btn-cancel').onclick = () => { overlay.style.display = 'none'; };
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substring(2);

        window.setLang = (l) => { currentLang = l; render(); };
        window.setTeacherFilter = (t) => { selectedTeacher = t; selectedClass = 'all'; render(); };
        window.setClassFilter = (c) => { selectedClass = c; render(); };
        window.setStatusFilter = (s) => { selectedStatus = s; render(); };
        window.toggleModal = (show) => { document.getElementById('modal-overlay').style.display = show ? 'flex' : 'none'; };
        window.toggleHistoryModal = (show) => { if (!show) window.cancelRecordEdit(); document.getElementById('history-modal-overlay').style.display = show ? 'flex' : 'none'; };
        window.toggleNoteModal = (show) => { document.getElementById('note-modal-overlay').style.display = show ? 'flex' : 'none'; };
        window.logout = () => { sessionStorage.removeItem('active_staff_session'); location.reload(); };

        window.openNoteModal = (id) => {
            const t = tDict[currentLang];
            const student = students.find(s => s.id === id);
            if (!student) return;
            currentNoteStudentId = id;
            document.getElementById('note-student-name').innerText = student.name;
            document.getElementById('student-note-input').value = student.note || '';
            document.getElementById('student-note-input').placeholder = t.notePlaceholder;
            document.getElementById('note-modal-title').innerText = t.noteTitle;
            document.getElementById('note-btn-cancel').innerText = t.cancelNote;
            document.getElementById('note-btn-save').innerText = t.btnSaveNote;
            window.toggleNoteModal(true);
        };

        window.saveStudentNote = async () => {
            if (!currentNoteStudentId) return;
            let currentInput = document.getElementById('student-note-input').value.trim();
            const student = students.find(s => s.id === currentNoteStudentId);
            const sRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', currentNoteStudentId);
            
            try {
                // 只有当内容发生实质性修改，且内容非空时，自动追加编辑者和日期签名
                if (student && currentInput !== (student.note || '').trim() && currentInput !== '') {
                    const dateObj = new Date();
                    const mmdd = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                    const signature = `[${loggedUser} ${mmdd}]`;
                    
                    // 防止同一人在同一天连续多次保存导致签名重复堆叠
                    if (!currentInput.endsWith(signature)) {
                        currentInput += `\n${signature}`;
                    }
                }
                
                await updateDoc(sRef, { note: currentInput });
                window.toggleNoteModal(false);
            } catch (err) { console.error("Error saving note:", err); }
        };

        window.openAddModal = () => {
            const t = tDict[currentLang];
            document.getElementById('modal-title').innerText = t.modalTitleAdd;
            document.getElementById('student-form').reset();
            document.getElementById('input-id').value = '';
            
            const teacherSelect = document.getElementById('input-teacher');
            teacherSelect.innerHTML = `<option value="">${t.placeholderTeacher}</option>` + teacherList.map(tchr => `<option value="${tchr}">${tchr}</option>`).join('');
            if (!isAdmin && loggedUser !== 'Director') {
                teacherSelect.value = loggedUser;
                teacherSelect.disabled = true;
            } else {
                teacherSelect.disabled = false;
            }

            const totalSelect = document.getElementById('input-total');
            totalSelect.innerHTML = [12, 24, 48, 96, 144].map(n => `<option value="${n}">${n}</option>`).join('');
            window.toggleModal(true);
        };

        window.editStudent = (id) => {
            const t = tDict[currentLang];
            const s = students.find(x => x.id === id);
            if (!s) return;
            document.getElementById('modal-title').innerText = t.modalTitleEdit;
            document.getElementById('input-id').value = s.id;
            document.getElementById('input-name').value = s.name;
            document.getElementById('input-contract').value = s.contract || '';
            document.getElementById('input-used').value = s.used;
            document.getElementById('input-date').value = s.payDate || '';
            document.getElementById('input-class').value = s.class || '';

            const teacherSelect = document.getElementById('input-teacher');
            teacherSelect.innerHTML = teacherList.map(tchr => `<option value="${tchr}">${tchr}</option>`).join('');
            teacherSelect.value = s.teacher;
            if (!isAdmin && loggedUser !== 'Director') { teacherSelect.disabled = true; } else { teacherSelect.disabled = false; }

            const totalSelect = document.getElementById('input-total');
            totalSelect.innerHTML = [12, 24, 48, 96, 144].map(n => `<option value="${n}">${n}</option>`).join('');
            if (![12, 24, 48, 96, 144].includes(Number(s.total))) {
                totalSelect.innerHTML += `<option value="${s.total}">${s.total}</option>`;
            }
            totalSelect.value = s.total;
            window.toggleModal(true);
        };

        window.toggleFreeze = async (id) => {
            const s = students.find(x => x.id === id);
            if (!s) return;
            const newFrozenState = !s.isFrozen;
            const t = tDict[currentLang];
            const dateStr = formatDate(new Date().toISOString());
            const typeStr = newFrozenState ? 'freeze' : 'unfreeze';
            const newHistory = [...(s.history || []), { date: dateStr, type: typeStr }];
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), { isFrozen: newFrozenState, history: newHistory });
            } catch (err) { console.error("Error toggling freeze:", err); }
        };

        window.toggleArchive = async (id) => {
            const s = students.find(x => x.id === id);
            if (!s) return;
            const newArchiveState = !s.isArchived;
            const t = tDict[currentLang];
            const dateStr = formatDate(new Date().toISOString());
            const typeStr = newArchiveState ? 'archive' : 'unarchive';
            const newHistory = [...(s.history || []), { date: dateStr, type: typeStr }];
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), { isArchived: newArchiveState, history: newHistory });
            } catch (err) { console.error("Error toggling archive:", err); }
        };

        window.deleteStudent = (id) => {
            customConfirm(tDict[currentLang].confirmDelete, async () => {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id));
                } catch (err) { console.error("Error deleting student:", err); }
            });
        };

        window.recordClass = async (id, amount) => {
            const s = students.find(x => x.id === id);
            if (!s) return;
            const newUsed = Math.min(s.total, Math.max(0, s.used + amount));
            if (newUsed === s.used) return;
            
            const dateStr = formatDate(new Date().toISOString());
            const typeStr = amount > 0 ? 'add' : 'absent';
            const newHistory = [...(s.history || []), { date: dateStr, type: typeStr }];
            
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), { used: newUsed, history: newHistory });
            } catch (err) { console.error("Error recording class:", err); }
        };

        window.openHistoryModal = (id) => {
            currentHistoryStudentId = id;
            const s = students.find(x => x.id === id);
            if (!s) return;
            const t = tDict[currentLang];
            document.getElementById('history-modal-title').innerText = t.historyTitle + ` - ${s.name}`;
            
            const contractDiv = document.getElementById('history-contract-container');
            const contractDisplay = document.getElementById('history-contract-display');
            if (s.contract) {
                contractDisplay.innerText = s.contract;
                contractDiv.setAttribute('data-contract', s.contract);
                contractDiv.classList.remove('hidden');
            } else {
                contractDiv.classList.add('hidden');
            }

            document.getElementById('manual-date-input').value = formatDate(new Date().toISOString());
            window.cancelRecordEdit();
            renderHistoryList();
            window.toggleHistoryModal(true);
        };

        window.copyContractNumber = () => {
            const container = document.getElementById('history-contract-container');
            const textToCopy = container.getAttribute('data-contract');
            if (!textToCopy) return;
            
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            try { document.execCommand('copy'); } catch (err) { console.error('Copy failed', err); }
            document.body.removeChild(textArea);
            
            const btn = document.getElementById('btn-copy-contract');
            const origIcon = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-green-500"></i>`;
            lucide.createIcons();
            setTimeout(() => { btn.innerHTML = origIcon; lucide.createIcons(); }, 1500);
        };

        window.editRecord = (index) => {
            const s = students.find(x => x.id === currentHistoryStudentId);
            if (!s || !s.history || !s.history[index]) return;
            editingRecordIndex = index;
            document.getElementById('manual-date-input').value = s.history[index].date;
            document.getElementById('btn-record-action').innerText = tDict[currentLang].btnUpdate;
            document.getElementById('btn-record-action').classList.replace('bg-[#2C5F56]', 'bg-[#FFC554]');
            document.getElementById('btn-record-action').classList.replace('text-white', 'text-[#1A2E35]');
            document.getElementById('btn-record-cancel').classList.remove('hidden');
        };

        window.cancelRecordEdit = () => {
            editingRecordIndex = -1;
            document.getElementById('manual-date-input').value = formatDate(new Date().toISOString());
            document.getElementById('btn-record-action').innerText = tDict[currentLang].manualAdd;
            document.getElementById('btn-record-action').classList.replace('bg-[#FFC554]', 'bg-[#2C5F56]');
            document.getElementById('btn-record-action').classList.replace('text-[#1A2E35]', 'text-white');
            document.getElementById('btn-record-cancel').classList.add('hidden');
        };

        window.handleRecordAction = async () => {
            const s = students.find(x => x.id === currentHistoryStudentId);
            if (!s) return;
            const newDate = document.getElementById('manual-date-input').value;
            if (!newDate) return;
            
            let updatedHistory = [...(s.history || [])];
            let newUsed = s.used;

            if (editingRecordIndex > -1) {
                updatedHistory[editingRecordIndex].date = newDate;
            } else {
                updatedHistory.push({ date: newDate, type: 'add' });
                newUsed = Math.min(s.total, s.used + 1);
            }
            
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', currentHistoryStudentId), { used: newUsed, history: updatedHistory });
                window.cancelRecordEdit();
            } catch (err) { console.error("Error updating record:", err); }
        };

        window.deleteRecord = (index) => {
            customConfirm(tDict[currentLang].confirmDeleteRecord, async () => {
                const s = students.find(x => x.id === currentHistoryStudentId);
                if (!s || !s.history) return;
                
                const rec = s.history[index];
                let newUsed = s.used;
                if (rec.type === 'add') newUsed = Math.max(0, s.used - 1);
                else if (rec.type === 'absent') newUsed = Math.min(s.total, s.used + 1);
                
                const newHistory = s.history.filter((_, i) => i !== index);
                
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', currentHistoryStudentId), { used: newUsed, history: newHistory });
                    if (editingRecordIndex === index) window.cancelRecordEdit();
                } catch (err) { console.error("Error deleting record:", err); }
            });
        };

        const renderHistoryList = () => {
            const list = document.getElementById('history-list');
            const s = students.find(x => x.id === currentHistoryStudentId);
            const t = tDict[currentLang];
            
            if (!s || !s.history || s.history.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-slate-300 font-bold flex flex-col items-center"><i data-lucide="inbox" class="w-10 h-10 mb-3 opacity-50"></i>${t.historyEmpty}</div>`;
                lucide.createIcons();
                return;
            }

            // 修正排序逻辑：优先按日期倒序，若日期相同（如同日记课），则按添加次序倒序（新加的排上面）
            const sortedHistory = [...s.history].map((item, index) => ({...item, originalIndex: index})).sort((a, b) => {
                const timeA = new Date(a.date).getTime();
                const timeB = new Date(b.date).getTime();
                if (timeA !== timeB) return timeB - timeA;
                return b.originalIndex - a.originalIndex; // 同一天的情况，后添加的 originalIndex 更大，排在前面
            });

            list.innerHTML = sortedHistory.map(item => {
                const isAdd = item.type === 'add';
                const isAbsent = item.type === 'absent';
                const isArchive = item.type === 'archive';
                const isUnarchive = item.type === 'unarchive';
                const isFreeze = item.type === 'freeze';
                const isUnfreeze = item.type === 'unfreeze';
                
                const dateObj = new Date(item.date);
                const dayName = t.days[dateObj.getDay()];
                const dayNum = String(dateObj.getDate()).padStart(2, '0');
                const monthName = String(dateObj.getMonth() + 1).padStart(2, '0');
                const isSystemLog = isArchive || isUnarchive || isFreeze || isUnfreeze;
                
                let actionDisplay = '';
                if (isAbsent) actionDisplay = `<span class="text-rose-500 font-bold ml-2 text-xs">${t.absentMark}</span>`;
                else if (isArchive) actionDisplay = `<span class="text-slate-500 font-bold ml-2 text-xs">${t.archiveMark}</span>`;
                else if (isUnarchive) actionDisplay = `<span class="text-[#2C5F56] font-bold ml-2 text-xs">${t.unarchiveMark}</span>`;
                else if (isFreeze) actionDisplay = `<span class="text-blue-500 font-bold ml-2 text-xs">${t.freezeMark}</span>`;
                else if (isUnfreeze) actionDisplay = `<span class="text-amber-500 font-bold ml-2 text-xs">${t.unfreezeMark}</span>`;

                return `
                    <div class="flex items-center justify-between p-4 bg-[#F7FAF9] rounded-3xl border border-transparent hover:border-[#2C5F56]/10 transition-all group">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white rounded-2xl flex flex-col items-center justify-center shadow-sm text-[#1A2E35]">
                                <span class="text-[10px] font-black uppercase text-slate-400 leading-none">${dayName}</span>
                                <span class="text-lg font-[900] leading-none mt-0.5">${dayNum}</span>
                            </div>
                            <div>
                                <p class="font-bold text-[#1A2E35] flex items-center">${dateObj.getFullYear()}-${monthName}-${dayNum} ${actionDisplay}</p>
                                <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest">${isSystemLog ? 'System Log' : (isAdd ? '+1 Class' : 'Status Update')}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            ${!isSystemLog ? `<button onclick="editRecord(${item.originalIndex})" class="p-2 bg-white text-slate-400 hover:text-amber-500 rounded-xl shadow-sm"><i data-lucide="edit-2" class="w-4 h-4"></i></button>` : ''}
                            <button onclick="deleteRecord(${item.originalIndex})" class="p-2 bg-white text-slate-400 hover:text-rose-500 rounded-xl shadow-sm"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();

            // 自动置顶，确保用户直接看到最新添加的记录
            setTimeout(() => {
                list.scrollTop = 0;
            }, 10);
        };

        const render = () => {
            const t = tDict[currentLang];
            
            // Translations
            document.getElementById('portal-title').innerText = t.portalTitle;
            document.getElementById('portal-subtitle').innerText = t.portalSub;
            document.getElementById('entry-name').placeholder = t.entryName;
            document.getElementById('entry-pin').placeholder = t.entryPin;
            document.getElementById('btn-enter').innerText = t.btnEnter;
            document.getElementById('auth-error').innerText = t.errPin;
            
            document.getElementById('page-title-main').innerText = t.dashboardTitle;
            document.getElementById('page-subtitle').innerText = t.subtitle;
            document.getElementById('add-btn-text').innerText = t.addBtn;
            document.getElementById('current-lang-text').innerText = currentLang.toUpperCase();
            
            document.getElementById('stat-total-label').innerText = t.statTotal;
            document.getElementById('stat-warning-label').innerText = t.statWarning;
            document.getElementById('stat-overdue-label').innerText = t.statOverdue;
            document.getElementById('stat-frozen-label').innerText = t.statFrozen;
            document.getElementById('stat-archived-label').innerText = t.statArchived;

            document.getElementById('filter-label').innerText = t.filterLabel;
            document.getElementById('filter-class-label').innerText = t.filterClassLabel;
            document.getElementById('filter-status-label').innerText = t.filterStatusLabel;

            // Form labels
            document.getElementById('label-name').innerText = t.labelName;
            document.getElementById('input-name').placeholder = t.placeholderName;
            document.getElementById('label-contract').innerText = t.labelContract;
            document.getElementById('input-contract').placeholder = t.placeholderContract;
            document.getElementById('label-teacher').innerText = t.labelTeacher;
            document.getElementById('label-class').innerText = t.labelClass;
            document.getElementById('input-class').placeholder = t.placeholderClass;
            document.getElementById('label-total').innerText = t.labelTotal;
            document.getElementById('label-used').innerText = t.labelUsed;
            document.getElementById('label-date').innerText = t.labelPayDate;
            document.getElementById('btn-cancel').innerText = t.btnCancel;
            document.getElementById('btn-save').innerText = t.btnSave;
            
            document.getElementById('history-modal-title').innerText = t.historyTitle;
            document.getElementById('btn-close-history').innerText = t.btnClose;
            document.getElementById('btn-record-action').innerText = editingRecordIndex > -1 ? t.btnUpdate : t.manualAdd;

            const permittedStudents = (isAdmin || loggedUser === 'Director') ? students : students.filter(s => s.teacher === loggedUser);

            const activeStudents = permittedStudents.filter(s => !s.isArchived);
            let total = activeStudents.length, warning = 0, overdue = 0, frozen = 0, archived = permittedStudents.filter(s => s.isArchived).length;
            const classSet = new Set();
            
            activeStudents.forEach(s => {
                if (s.class) classSet.add(s.class);
                if (s.isFrozen) frozen++;
                else {
                    const rem = s.total - s.used;
                    if (rem <= 0) overdue++;
                    else if (rem <= 3) warning++;
                }
            });

            document.getElementById('stat-total-val').innerText = total;
            document.getElementById('stat-warning-val').innerText = warning;
            document.getElementById('stat-overdue-val').innerText = overdue;
            document.getElementById('stat-frozen-val').innerText = frozen;
            document.getElementById('stat-archived-val').innerText = archived;

            // Teacher Filters
            if (isAdmin) {
                const tc = document.getElementById('teacher-filter-container');
                tc.innerHTML = `<button onclick="setTeacherFilter('all')" class="filter-chip ${selectedTeacher === 'all' ? 'active' : 'bg-[#F7FAF9] text-[#2C5F56] hover:bg-[#D1DEDC]'} px-4 py-2 rounded-2xl font-bold text-[10px] uppercase transition-all shadow-sm">${t.filterAll}</button>`;
                teacherList.forEach(tchr => {
                    const count = students.filter(s => s.teacher === tchr && !s.isArchived).length;
                    tc.innerHTML += `<button onclick="setTeacherFilter('${tchr}')" class="filter-chip ${selectedTeacher === tchr ? 'active' : 'bg-[#F7FAF9] text-[#2C5F56] hover:bg-[#D1DEDC]'} px-4 py-2 rounded-2xl font-bold text-[10px] uppercase transition-all shadow-sm">${tchr} <span class="ml-1 opacity-70">(${count})</span></button>`;
                });
            }

            // Class Filters
            const cc = document.getElementById('class-filter-container');
            cc.innerHTML = `<button onclick="setClassFilter('all')" class="filter-chip ${selectedClass === 'all' ? 'active' : 'bg-[#F7FAF9] text-[#2C5F56] hover:bg-[#D1DEDC]'} px-4 py-2 rounded-2xl font-bold text-[10px] uppercase transition-all shadow-sm">${t.filterAll}</button>`;
            Array.from(classSet).sort().forEach(cls => {
                cc.innerHTML += `<button onclick="setClassFilter('${cls}')" class="filter-chip ${selectedClass === cls ? 'active' : 'bg-[#F7FAF9] text-[#2C5F56] hover:bg-[#D1DEDC]'} px-4 py-2 rounded-2xl font-bold text-[10px] uppercase transition-all shadow-sm">${cls}</button>`;
            });
            document.getElementById('class-list').innerHTML = Array.from(classSet).map(c => `<option value="${c}">`).join('');

            // Status Filters
            const sc = document.getElementById('status-filter-container');
            const statusOpts = [
                { id: 'all', label: t.filterAll, class: 'text-[#2C5F56]' },
                { id: 'paid', label: t.statusPaid, class: 'text-emerald-600' },
                { id: 'warning', label: t.statusWarning, class: 'text-amber-600' },
                { id: 'overdue', label: t.statusOverdue, class: 'text-rose-600' },
                { id: 'frozen', label: t.statusFrozen, class: 'text-blue-600' },
                { id: 'archived', label: t.statusArchived, class: 'text-slate-500' }
            ];
            sc.innerHTML = statusOpts.map(opt => `<button onclick="setStatusFilter('${opt.id}')" class="filter-chip ${selectedStatus === opt.id ? 'active' : `bg-[#F7FAF9] ${opt.class} hover:bg-[#D1DEDC]`} px-4 py-2 rounded-2xl font-bold text-[10px] uppercase transition-all shadow-sm">${opt.label}</button>`).join('');

            // Apply Filters
            let filtered = permittedStudents;
            
            // Base structural filter (archived or not)
            if (selectedStatus === 'archived') {
                filtered = filtered.filter(s => s.isArchived);
            } else {
                // If not viewing archived explicitly, hide them from all other views
                filtered = filtered.filter(s => !s.isArchived);
                
                if (selectedStatus !== 'all') {
                    filtered = filtered.filter(s => {
                        const rem = s.total - s.used;
                        if (selectedStatus === 'frozen') return s.isFrozen;
                        if (s.isFrozen) return false;
                        if (selectedStatus === 'overdue') return rem <= 0;
                        if (selectedStatus === 'warning') return rem > 0 && rem <= 3;
                        if (selectedStatus === 'paid') return rem > 3;
                        return true;
                    });
                }
            }

            if (selectedTeacher !== 'all') filtered = filtered.filter(s => s.teacher === selectedTeacher);
            if (selectedClass !== 'all') filtered = filtered.filter(s => s.class === selectedClass);
            
            filtered.sort((a, b) => (a.total - a.used) - (b.total - b.used));

            // Render Table Header
            document.getElementById('table-head-row').innerHTML = `
                <th class="p-5 font-[900] text-[#1A2E35] tracking-tight w-1/6 rounded-tl-3xl">${t.thName}</th>
                <th class="p-5 font-[900] text-[#1A2E35] tracking-tight w-32 hidden md:table-cell">${t.thTeacher}</th>
                <th class="p-5 font-[900] text-[#1A2E35] tracking-tight w-24 hidden lg:table-cell">${t.thClass}</th>
                <th class="p-5 font-[900] text-[#1A2E35] tracking-tight w-48">${t.thProgress}</th>
                <th class="p-5 font-[900] text-[#1A2E35] tracking-tight text-center w-24">${t.thRemaining}</th>
                <th class="p-5 font-[900] text-[#1A2E35] tracking-tight text-center w-32 hidden sm:table-cell">${t.thLastPay}</th>
                <th class="p-5 font-[900] text-[#1A2E35] tracking-tight text-center w-24">${t.thStatus}</th>
                <th class="p-5 font-[900] text-[#1A2E35] tracking-tight text-right rounded-tr-3xl min-w-[280px]">${t.thActions}</th>
            `;

            // Render Table Body
            const tbody = document.getElementById('student-table-body');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-16 text-center text-slate-300 font-bold"><div class="flex flex-col items-center justify-center"><i data-lucide="ghost" class="w-12 h-12 mb-4 opacity-30"></i><span>${t.noMatch}</span></div></td></tr>`;
            } else {
                tbody.innerHTML = filtered.map(s => {
                    const rem = s.total - s.used;
                    const pct = Math.min(100, Math.max(0, (s.used / s.total) * 100));
                    
                    let statusLabel = t.statusPaid, statusColor = 'bg-emerald-50 text-emerald-600 border-emerald-200', pbColor = 'bg-emerald-400';
                    if (s.isArchived) { statusLabel = t.statusArchived; statusColor = 'bg-slate-100 text-slate-500 border-slate-200'; pbColor = 'bg-slate-400'; }
                    else if (s.isFrozen) { statusLabel = t.statusFrozen; statusColor = 'bg-blue-50 text-blue-600 border-blue-200'; pbColor = 'bg-blue-400'; }
                    else if (rem <= 0) { statusLabel = t.statusOverdue; statusColor = 'bg-rose-50 text-rose-600 border-rose-200 animate-pulse'; pbColor = 'bg-rose-500'; }
                    else if (rem <= 3) { statusLabel = t.statusWarning; statusColor = 'bg-amber-50 text-amber-600 border-amber-200'; pbColor = 'bg-amber-400'; }

                    const trClass = s.isArchived ? "table-row-modern opacity-60 hover:opacity-100" : "table-row-modern";

                    let actionBtns = '';
                    if (!s.isArchived) {
                        if (!s.isFrozen) {
                            actionBtns += `
                                <button onclick="recordClass('${s.id}', 1)" title="${t.actionPlus}" class="w-9 h-9 rounded-full bg-[#F7FAF9] text-[#2C5F56] hover:bg-[#2C5F56] hover:text-white flex items-center justify-center transition-all shadow-sm active:scale-90"><i data-lucide="plus-circle" class="w-4 h-4"></i></button>
                                <button onclick="recordClass('${s.id}', -1)" title="${t.actionAbsent}" class="w-9 h-9 rounded-full bg-rose-50 text-rose-500 hover:bg-rose-500 hover:text-white flex items-center justify-center transition-all shadow-sm active:scale-90"><i data-lucide="user-minus" class="w-4 h-4"></i></button>
                                <button onclick="toggleFreeze('${s.id}')" title="${t.actionFreeze}" class="w-9 h-9 rounded-full bg-blue-50 text-blue-500 hover:bg-blue-500 hover:text-white flex items-center justify-center transition-all shadow-sm active:scale-90"><i data-lucide="snowflake" class="w-4 h-4"></i></button>
                            `;
                        } else {
                            actionBtns += `
                                <button onclick="toggleFreeze('${s.id}')" title="${t.actionUnfreeze}" class="w-9 h-9 rounded-full bg-amber-50 text-amber-500 hover:bg-amber-500 hover:text-white flex items-center justify-center transition-all shadow-sm active:scale-90"><i data-lucide="flame" class="w-4 h-4"></i></button>
                            `;
                        }
                    }

                    actionBtns += `
                        <button onclick="toggleArchive('${s.id}')" title="${s.isArchived ? t.actionUnarchive : t.actionArchive}" class="w-9 h-9 rounded-full ${s.isArchived ? 'bg-emerald-50 text-emerald-600 hover:bg-emerald-500' : 'bg-slate-50 text-slate-500 hover:bg-slate-700'} hover:text-white flex items-center justify-center transition-all shadow-sm active:scale-90"><i data-lucide="${s.isArchived ? 'archive-restore' : 'archive'}" class="w-4 h-4"></i></button>
                        <button onclick="editStudent('${s.id}')" title="${t.actionEdit}" class="w-9 h-9 rounded-full bg-slate-50 text-slate-500 hover:bg-slate-500 hover:text-white flex items-center justify-center transition-all shadow-sm active:scale-90"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button onclick="deleteStudent('${s.id}')" title="${t.actionDelete}" class="w-9 h-9 rounded-full bg-rose-50 text-rose-500 hover:bg-rose-600 hover:text-white flex items-center justify-center transition-all shadow-sm active:scale-90"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    `;

                    return `
                        <tr class="${trClass}">
                            <td class="p-4">
                                <div class="flex items-center gap-2">
                                    <div onclick="openNoteModal('${s.id}')" class="font-bold text-[#1A2E35] cursor-pointer hover:text-[#2C5F56] transition-colors group flex items-center gap-1.5" title="点击添加/查看备注">
                                        <span class="truncate max-w-[120px] sm:max-w-[150px] inline-block">${s.name}</span>
                                        ${s.note ? `<i data-lucide="file-text" class="w-3.5 h-3.5 text-amber-500 shrink-0"></i>` : `<i data-lucide="plus" class="w-3 h-3 text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity shrink-0"></i>`}
                                    </div>
                                    <button onclick="openHistoryModal('${s.id}')" title="${t.actionHistory}" class="ml-1 w-7 h-7 rounded-lg bg-[#FFF9EB] text-amber-600 hover:bg-amber-500 hover:text-white flex items-center justify-center transition-all shadow-sm active:scale-90 shrink-0">
                                        <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </td>
                            <td class="p-4 font-bold text-slate-500 hidden md:table-cell">${s.teacher}</td>
                            <td class="p-4 hidden lg:table-cell">
                                <span class="bg-[#F7FAF9] text-[#2C5F56] px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider">${s.class || '-'}</span>
                            </td>
                            <td class="p-4">
                                <div class="flex items-center gap-3">
                                    <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden shadow-inner"><div class="h-full ${pbColor} rounded-full" style="width: ${pct}%"></div></div>
                                    <span class="text-xs font-black text-slate-400 w-12 text-right">${s.used}/${s.total}</span>
                                </div>
                            </td>
                            <td class="p-4 text-center"><span class="text-lg font-[900] ${rem <= 3 && !s.isArchived && !s.isFrozen ? 'text-rose-500' : 'text-[#1A2E35]'}">${rem}</span></td>
                            <td class="p-4 text-center font-bold text-slate-400 text-xs hidden sm:table-cell">${s.payDate || '-'}</td>
                            <td class="p-4 text-center">
                                <span class="px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest border ${statusColor}">${statusLabel}</span>
                            </td>
                            <td class="p-4 text-right">
                                <div class="flex items-center justify-end gap-1.5">${actionBtns}</div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
            lucide.createIcons();
            if (currentHistoryStudentId && document.getElementById('history-modal-overlay').style.display === 'flex') {
                renderHistoryList();
            }
        };

        const startApp = async () => {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app); 
            db = getFirestore(app);

            // Form Submit Listener
            document.getElementById('student-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('input-id').value;
                const data = {
                    name: document.getElementById('input-name').value.trim(),
                    contract: document.getElementById('input-contract').value.trim(),
                    teacher: document.getElementById('input-teacher').value,
                    class: document.getElementById('input-class').value.trim(),
                    total: parseInt(document.getElementById('input-total').value),
                    used: parseInt(document.getElementById('input-used').value),
                    payDate: document.getElementById('input-date').value
                };

                try {
                    if (id) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), data);
                    } else {
                        const newId = generateId();
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', newId), { ...data, history: [], isFrozen: false, isArchived: false, note: '' });
                    }
                    window.toggleModal(false);
                } catch (err) { console.error("Error saving student:", err); }
            });

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const studentsCol = collection(db, 'artifacts', appId, 'public', 'data', 'students');
                    onSnapshot(query(studentsCol), (snapshot) => {
                        students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        
                        // Auto-migrate Anlaoshi to Alaoshi
                        students.forEach(s => {
                            if (s.teacher === 'Anlaoshi') {
                                updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), { teacher: 'Alaoshi' });
                            }
                        });

                        render();
                    }, (error) => {
                        console.error("Firestore snapshot error:", error);
                    });
                }
            });

            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            await initAuth();
            
            verifySession();

            const processAuth = () => {
                const name = document.getElementById('entry-name').value.trim();
                const pin = document.getElementById('entry-pin').value.trim();
                if (teacherPins[name] === pin) {
                    sessionStorage.setItem('active_staff_session', name);
                    verifySession();
                } else {
                    document.getElementById('auth-error').classList.remove('hidden');
                    setTimeout(() => document.getElementById('auth-error').classList.add('hidden'), 3000);
                }
            };

            document.getElementById('btn-enter').onclick = processAuth;
            document.getElementById('entry-pin').onkeypress = (e) => { if (e.key === 'Enter') processAuth(); };
            document.getElementById('entry-name').onkeypress = (e) => { if (e.key === 'Enter') processAuth(); };
        };

        const verifySession = () => {
            let saved = sessionStorage.getItem('active_staff_session');
            if (saved === 'Anlaoshi') {
                saved = 'Alaoshi';
                sessionStorage.setItem('active_staff_session', 'Alaoshi');
            }

            if (saved && (teacherList.includes(saved) || saved === 'Director')) {
                loggedUser = saved; isAdmin = (saved === 'Director');
                document.getElementById('entry-gate').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('logged-user-name').innerText = isAdmin ? 'Director' : saved;
                document.getElementById('user-avatar').innerText = isAdmin ? 'D' : saved[0].toUpperCase();
                document.getElementById('teacher-filter-wrap').classList.toggle('hidden', !isAdmin);
                render();
            }
        };

        startApp();
    </script>
</body>
</html>
