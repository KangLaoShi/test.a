<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="ntP4lAS8QsT41GBuCxeV4UtMZDQkhIBgchnd-nFOv_4" />
    <title>NSRE Dashboard - Private Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --brand-green: #2C5F56;
            --brand-mint: #F1F8F6;
            --brand-yellow: #FFC554;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: var(--brand-mint);
            color: #1A2E35;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #D1DEDC; border-radius: 10px; }

        .card-modern {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 4px 20px -2px rgba(44, 95, 86, 0.04);
            border: 1px solid rgba(255, 255, 255, 1);
        }

        .btn-active:active { transform: scale(0.95); }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(44, 95, 86, 0.08); }

        .filter-chip.active { 
            background: var(--brand-green); 
            color: white; 
            box-shadow: 0 10px 15px -3px rgba(44, 95, 86, 0.2);
            border-color: var(--brand-green);
        }
        
        .lang-item.active { background-color: var(--brand-green); color: white; font-weight: 800; }

        .pin-mask { -webkit-text-security: disc; }

        .bg-mesh {
            background-color: var(--brand-mint);
            background-image: radial-gradient(at 0% 0%, rgba(44, 95, 86, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 0%, rgba(255, 197, 84, 0.03) 0px, transparent 50%);
        }

        .table-row-modern:hover { background-color: rgba(44, 95, 86, 0.04); transform: translateX(4px); }
    </style>
</head>
<body class="bg-mesh min-h-screen">
    
    <!-- 访问入口页面 -->
    <div id="entry-gate" class="fixed inset-0 z-[500] flex items-center justify-center p-4 bg-[#1A2E35]">
        <div class="absolute inset-0 opacity-10" style="background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');"></div>
        <div class="bg-white rounded-[40px] shadow-2xl w-full max-w-md p-12 text-center relative z-10 border-t-8 border-[#2C5F56]">
            <div class="mb-8 text-center">
                <img src="./logo.png" alt="Logo" class="h-16 w-auto mx-auto object-contain drop-shadow-md" onerror="this.style.display='none'; document.getElementById('logo-fallback').classList.remove('hidden');" />
                <div id="logo-fallback" class="hidden w-20 h-20 bg-[#2C5F56] rounded-[28px] mx-auto flex items-center justify-center shadow-2xl">
                    <span class="text-white font-black text-2xl italic">NS</span>
                </div>
            </div>
            <h2 id="portal-title" class="text-2xl font-[800] text-[#1A2E35] mb-2 tracking-tight">内部教学记录系统</h2>
            <p id="portal-subtitle" class="text-[#2C5F56] font-bold mb-10 text-xs uppercase tracking-[0.2em]">私有教学管理面板</p>
            
            <div id="auth-container" class="space-y-5 text-left mb-6">
                <div><input id="entry-name" type="text" class="w-full px-6 py-5 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none focus:ring-2 focus:ring-[#2C5F56]/10" placeholder="教师姓名 (例如: Kanglaoshi)"></div>
                <div><input id="entry-pin" type="text" class="w-full px-6 py-5 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none focus:ring-2 focus:ring-[#2C5F56]/10 pin-mask" placeholder="访问识别码 (PIN)"></div>
                <button id="btn-enter" class="w-full bg-[#2C5F56] text-white py-5 rounded-3xl font-bold shadow-xl hover:opacity-90 active:scale-[0.98] transition-all mt-2 text-sm">进入工作台</button>
            </div>

            <div class="flex justify-center gap-3 border-t border-slate-50 pt-6">
                <button onclick="setLang('zh')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">ZH</button>
                <button onclick="setLang('uz')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">UZ</button>
                <button onclick="setLang('ru')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">RU</button>
                <button onclick="setLang('en')" class="text-[10px] font-black text-slate-400 hover:text-[#2C5F56]">EN</button>
            </div>
            <p id="auth-error" class="text-rose-500 text-xs font-bold mt-6 hidden">识别码错误，请重新输入。</p>
        </div>
    </div>

    <!-- 主页面 -->
    <div id="app-content" class="max-w-[1440px] mx-auto p-4 md:p-8 hidden">
        <header class="relative z-[100] flex flex-col lg:flex-row lg:items-center justify-between mb-10 gap-6 bg-white/50 p-6 rounded-[32px] border border-white shadow-sm backdrop-blur-md">
            <div class="flex flex-col">
                <h1 id="page-title-main" class="text-2xl md:text-3xl font-[900] text-[#1A2E35]">学生付费跟进管理</h1>
                <p id="page-subtitle" class="text-[#2C5F56]/50 font-bold text-[10px] uppercase tracking-[0.2em] mt-1">协作版 · 实时云同步</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <div class="relative group">
                    <button class="flex items-center gap-2 bg-white px-5 h-[52px] rounded-full text-[#1A2E35] border border-[#D1DEDC] font-bold text-[10px] uppercase tracking-widest">
                        <i data-lucide="globe" class="w-3.5 h-3.5 text-[#2C5F56]"></i>
                        <span id="current-lang-text">ZH</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 text-slate-300"></i>
                    </button>
                    <div class="absolute right-0 mt-2 w-44 bg-white border border-[#D1DEDC] rounded-[24px] shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-[150] overflow-hidden p-2">
                        <button onclick="setLang('zh')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors mb-1">中文 (ZH)</button>
                        <button onclick="setLang('uz')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors mb-1">O'zbek (UZ)</button>
                        <button onclick="setLang('ru')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors mb-1">Русский (RU)</button>
                        <button onclick="setLang('en')" class="lang-item w-full text-left px-5 py-2.5 text-[10px] font-bold rounded-xl transition-colors">English (EN)</button>
                    </div>
                </div>
                <div class="flex items-center gap-3 bg-[#1A2E35] px-5 h-[52px] rounded-full shadow-lg">
                    <div class="w-8 h-8 bg-[#FFC554] text-[#1A2E35] rounded-lg flex items-center justify-center font-black text-[10px]" id="user-avatar">?</div>
                    <span id="logged-user-name" class="text-[11px] font-bold text-white tracking-tight">---</span>
                    <button onclick="logout()" class="ml-1 text-slate-500 hover:text-rose-400 transition-colors"><i data-lucide="power" class="w-3.5 h-3.5"></i></button>
                </div>
                <button onclick="openAddModal()" class="btn-active flex items-center gap-2 bg-[#2C5F56] text-white px-6 h-[52px] rounded-full shadow-xl shadow-[#2C5F56]/20 font-bold text-xs">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i><span id="add-btn-text">添加学生</span>
                </button>
            </div>
        </header>

        <main class="space-y-8">
            <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
                <div onclick="setStatusFilter('all')" class="card-modern p-5 flex items-center gap-4 hover-lift border-l-8 border-[#2C5F56] cursor-pointer transition-all active:scale-95" title="点击查看所有学生">
                    <div class="w-12 h-12 bg-[#F0F6F5] text-[#2C5F56] rounded-2xl flex items-center justify-center shrink-0"><i data-lucide="users-2" class="w-5 h-5"></i></div>
                    <div><p id="stat-total-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5 whitespace-nowrap">学生总数</p><p id="stat-total-val" class="text-2xl font-[900] text-[#1A2E35]">0</p></div>
                </div>
                <div onclick="setStatusFilter('trial')" class="card-modern p-5 flex items-center gap-4 hover-lift border-l-8 border-purple-500 cursor-pointer transition-all active:scale-95" title="点击筛选试听学生">
                    <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center shrink-0"><i data-lucide="headphones" class="w-5 h-5"></i></div>
                    <div><p id="stat-trial-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5 whitespace-nowrap">试听学生</p><p id="stat-trial-val" class="text-2xl font-[900] text-purple-600">0</p></div>
                </div>
                <div onclick="setStatusFilter('warning')" class="card-modern p-5 flex items-center gap-4 hover-lift border-l-8 border-[#FFC554] cursor-pointer transition-all active:scale-95" title="点击筛选即将到期">
                    <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center shrink-0"><i data-lucide="hourglass" class="w-5 h-5"></i></div>
                    <div><p id="stat-warning-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5 whitespace-nowrap">即将到期</p><p id="stat-warning-val" class="text-2xl font-[900] text-[#1A2E35]">0</p></div>
                </div>
                <div onclick="setStatusFilter('overdue')" class="card-modern p-5 flex items-center gap-4 hover-lift border-l-8 border-rose-500 cursor-pointer transition-all active:scale-95" title="点击筛选欠费学生">
                    <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center shrink-0"><i data-lucide="alert-octagon" class="w-5 h-5"></i></div>
                    <div><p id="stat-overdue-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5 whitespace-nowrap">欠费预警</p><p id="stat-overdue-val" class="text-2xl font-[900] text-rose-500">0</p></div>
                </div>
                <div onclick="setStatusFilter('frozen')" class="card-modern p-5 flex items-center gap-4 hover-lift border-l-8 border-blue-500 cursor-pointer transition-all active:scale-95" title="点击筛选冻结学生">
                    <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center shrink-0"><i data-lucide="snowflake" class="w-5 h-5"></i></div>
                    <div><p id="stat-frozen-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5 whitespace-nowrap">冻结账户</p><p id="stat-frozen-val" class="text-2xl font-[900] text-blue-500">0</p></div>
                </div>
                <div onclick="setStatusFilter('archived')" class="card-modern p-5 flex items-center gap-4 hover-lift border-l-8 border-slate-400 cursor-pointer transition-all active:scale-95" title="点击筛选停学归档">
                    <div class="w-12 h-12 bg-slate-50 text-slate-500 rounded-2xl flex items-center justify-center shrink-0"><i data-lucide="archive" class="w-5 h-5"></i></div>
                    <div><p id="stat-archived-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5 whitespace-nowrap">停学归档</p><p id="stat-archived-val" class="text-2xl font-[900] text-slate-500">0</p></div>
                </div>
            </div>

            <!-- New Class Category Stats Row -->
            <div class="grid grid-cols-3 md:grid-cols-4 xl:grid-cols-7 gap-4">
                <div onclick="setCategoryFilter('hsk1')" id="card-hsk1" class="card-modern p-4 flex flex-col items-center justify-center gap-1 hover-lift border-b-4 border-slate-200 cursor-pointer transition-all active:scale-95" title="点击筛选 HSK 1">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">HSK 1</span>
                    <span id="stat-hsk1-val" class="text-2xl font-[900] text-[#1A2E35]">0</span>
                </div>
                <div onclick="setCategoryFilter('hsk2')" id="card-hsk2" class="card-modern p-4 flex flex-col items-center justify-center gap-1 hover-lift border-b-4 border-slate-200 cursor-pointer transition-all active:scale-95" title="点击筛选 HSK 2">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">HSK 2</span>
                    <span id="stat-hsk2-val" class="text-2xl font-[900] text-[#1A2E35]">0</span>
                </div>
                <div onclick="setCategoryFilter('hsk3')" id="card-hsk3" class="card-modern p-4 flex flex-col items-center justify-center gap-1 hover-lift border-b-4 border-slate-200 cursor-pointer transition-all active:scale-95" title="点击筛选 HSK 3">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">HSK 3</span>
                    <span id="stat-hsk3-val" class="text-2xl font-[900] text-[#1A2E35]">0</span>
                </div>
                <div onclick="setCategoryFilter('hsk4')" id="card-hsk4" class="card-modern p-4 flex flex-col items-center justify-center gap-1 hover-lift border-b-4 border-slate-200 cursor-pointer transition-all active:scale-95" title="点击筛选 HSK 4">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">HSK 4</span>
                    <span id="stat-hsk4-val" class="text-2xl font-[900] text-[#1A2E35]">0</span>
                </div>
                <div onclick="setCategoryFilter('hsk5')" id="card-hsk5" class="card-modern p-4 flex flex-col items-center justify-center gap-1 hover-lift border-b-4 border-slate-200 cursor-pointer transition-all active:scale-95" title="点击筛选 HSK 5">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">HSK 5</span>
                    <span id="stat-hsk5-val" class="text-2xl font-[900] text-[#1A2E35]">0</span>
                </div>
                <div onclick="setCategoryFilter('hsk6')" id="card-hsk6" class="card-modern p-4 flex flex-col items-center justify-center gap-1 hover-lift border-b-4 border-slate-200 cursor-pointer transition-all active:scale-95" title="点击筛选 HSK 6">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">HSK 6</span>
                    <span id="stat-hsk6-val" class="text-2xl font-[900] text-[#1A2E35]">0</span>
                </div>
                <div onclick="setCategoryFilter('individual')" id="card-individual" class="card-modern p-4 flex flex-col items-center justify-center gap-1 hover-lift border-b-4 border-slate-200 cursor-pointer transition-all active:scale-95" title="点击筛选 一对一/VIP">
                    <span id="label-individual" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Individual</span>
                    <span id="stat-individual-val" class="text-2xl font-[900] text-[#1A2E35]">0</span>
                </div>
            </div>

            <div class="card-modern p-5 space-y-2">
                <div id="teacher-filter-wrap" class="hidden flex flex-col gap-1.5">
                    <span id="filter-label" class="text-[9px] font-black text-[#2C5F56]/40 uppercase ml-2">负责人:</span>
                    <div id="teacher-filter-container" class="flex flex-wrap gap-1.5"></div>
                </div>
                <div id="class-filter-wrap" class="flex flex-col gap-1.5 pt-3 border-t border-slate-50">
                    <span id="filter-class-label" class="text-[9px] font-black text-[#2C5F56]/40 uppercase ml-2">班级筛选:</span>
                    <div id="class-filter-container" class="flex flex-wrap gap-1.5"></div>
                </div>
                <div id="status-filter-wrap" class="flex flex-col gap-1.5 pt-3 border-t border-slate-50">
                    <span id="filter-status-label" class="text-[9px] font-black text-[#2C5F56]/40 uppercase ml-2">状态筛选:</span>
                    <div id="status-filter-container" class="flex flex-wrap gap-1.5"></div>
                </div>
            </div>

            <div class="card-modern overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-[#F7FAF9]/80 border-b border-slate-100">
                            <tr id="table-head-row"></tr>
                        </thead>
                        <tbody id="student-table-body" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-[#1A2E35]/90 backdrop-blur-lg hidden items-center justify-center p-4 z-[600]">
        <div class="bg-white rounded-[40px] shadow-2xl w-full max-w-md p-10 overflow-y-auto max-h-[90vh] border-t-8 border-[#FFC554]">
            <div class="flex justify-between items-center mb-10">
                <h3 id="modal-title" class="text-2xl font-[900]">编辑信息</h3>
                <button onclick="toggleModal(false)" class="p-3 text-slate-300 hover:text-rose-500"><i data-lucide="x"></i></button>
            </div>
            <form id="student-form" class="space-y-6 text-left">
                <input type="hidden" id="input-id">
                <div><label id="label-name" class="text-[10px] font-black text-slate-300 uppercase ml-4">姓名</label>
                <input id="input-name" type="text" required class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none" placeholder="输入姓名"></div>
                <div><label id="label-contract" class="text-[10px] font-black text-slate-300 uppercase ml-4">合同号</label>
                <input id="input-contract" type="text" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none" placeholder="输入号"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label id="label-teacher" class="text-[10px] font-black text-slate-300 uppercase ml-4">负责老师</label>
                    <select id="input-teacher" required class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold outline-none border-none appearance-none"></select></div>
                    <div><label id="label-class" class="text-[10px] font-black text-slate-300 uppercase ml-4">班级</label>
                    <input id="input-class" list="class-list" type="text" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none" placeholder="选择或输入"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div><label id="label-total" class="text-[10px] font-black text-slate-300 uppercase">当前总量</label>
                    <input id="input-total" type="text" inputmode="numeric" list="total-list" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none text-center" placeholder="选填，默认0"></div>
                    <div><label id="label-used" class="text-[10px] font-black text-slate-300 uppercase">已上</label>
                    <input id="input-used" type="number" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none text-center" placeholder="选填，默认0"></div>
                </div>
                
                <div id="add-lesson-container" class="hidden">
                    <label id="label-add" class="text-[10px] font-black text-[#2C5F56] uppercase ml-4">续费/新增课时</label>
                    <input id="input-add" type="number" class="w-full px-6 py-4 bg-[#F0F6F5] text-[#2C5F56] rounded-3xl font-bold border-none placeholder-[#2C5F56]/40" placeholder="输入新增课时数，例如: 12">
                </div>

                <div><label id="label-date" class="text-[10px] font-black text-slate-300 uppercase ml-4">付费日期</label>
                <input id="input-date" type="date" class="w-full px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none"></div>
                <div class="flex gap-4 pt-6">
                    <button type="button" onclick="toggleModal(false)" id="btn-cancel" class="flex-1 py-4 font-black text-slate-400">取消</button>
                    <button type="submit" id="btn-save" class="flex-1 py-4 bg-[#2C5F56] text-white rounded-3xl font-black shadow-xl">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Datalists for Autocomplete -->
    <datalist id="class-list"></datalist>
    <datalist id="total-list">
        <option value="0">试听 0</option>
        <option value="12"></option>
        <option value="24"></option>
        <option value="36"></option>
        <option value="48"></option>
        <option value="60"></option>
        <option value="72"></option>
    </datalist>

    <!-- History Modal -->
    <div id="history-modal-overlay" class="fixed inset-0 bg-[#1A2E35]/95 backdrop-blur-xl hidden items-center justify-center p-4 z-[700]">
        <div class="bg-white rounded-[40px] shadow-2xl w-full max-w-md p-12 flex flex-col max-h-[90vh] border-t-8 border-[#FFC554]">
            <div class="flex justify-between items-start mb-8 shrink-0">
                <div class="flex flex-col gap-2">
                    <h3 id="history-modal-title" class="text-2xl font-[900] text-[#1A2E35] tracking-tight">上课记录</h3>
                    <div id="history-contract-container" class="hidden flex items-center gap-2">
                        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-widest bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200" id="history-contract-display"></span>
                        <button onclick="copyContractNumber()" id="btn-copy-contract" class="p-1.5 bg-white border border-slate-200 text-slate-400 hover:text-[#2C5F56] hover:border-[#2C5F56] rounded-lg transition-all shadow-sm flex items-center justify-center">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
                <button onclick="toggleHistoryModal(false)" class="p-3 bg-slate-50 rounded-full text-slate-400 hover:text-rose-500 transition-colors"><i data-lucide="x"></i></button>
            </div>
            <div class="flex gap-3 mb-8 shrink-0">
                <input type="date" id="manual-date-input" class="flex-1 px-6 py-4 bg-[#F7FAF9] rounded-3xl font-bold border-none">
                <button onclick="handleRecordAction()" id="btn-record-action" class="px-8 py-4 bg-[#2C5F56] text-white rounded-3xl font-black">补签</button>
                <button onclick="cancelRecordEdit()" id="btn-record-cancel" class="hidden px-4 py-4 bg-rose-50 text-rose-500 font-bold rounded-2xl">✕</button>
            </div>

        let currentLang = 'zh', selectedTeacher = 'all', selectedClass = 'all', selectedCategory = 'all', selectedStatus = 'all', students = [], loggedUser = null, isAdmin = false, currentHistoryStudentId = null, currentNotesStudentId = null, editingRecordIndex = -1, db, auth;

        // 将班级列表和智能归类函数提升为全局变量，供界面和数据库自动清理程序同时使用
        const standardClasses = ["HSK1-1", "HSK1-2", "HSK1-3", "HSK2-1", "HSK2-2", "HSK2-3", "HSK3-1", "HSK3-2", "HSK3-3", "HSK4-1", "HSK4-2", "HSK5-1", "HSK5-2", "Individual-1", "Individual-2"];

        const getStandardClass = (raw) => {
            if (!raw) return 'Other';
            let s = String(raw).toUpperCase().replace(/\s+/g, '').replace(/[._]/g, '-');
            s = s.replace(/HSK-/g, 'HSK'); 
            
            if (s.includes('INDIVIDUAL') || s.includes('1V1') || s.includes('VIP') || s.includes('一对一')) {
                return s.includes('-2') || s.includes('2') ? 'Individual-2' : 'Individual-1';
            }
            
            if (s.includes('HSK')) {
                const match = s.match(/HSK(\d)(?:-(\d))?/);
                if (match) {
                    const lvl = match[1];
                    let sub = match[2] || '1';
                    if (['1','2','3'].includes(lvl)) sub = Math.min(3, Math.max(1, parseInt(sub)));
                    else if (['4','5'].includes(lvl)) sub = Math.min(2, Math.max(1, parseInt(sub)));
                    
                    const std = `HSK${lvl}-${sub}`;
                    if (standardClasses.includes(std)) return std;
                }
            }
            return 'Other';
        };

        const customConfirm = (msg, callback) => {
            const overlay = document.getElementById('confirm-modal-overlay');
            const t = tDict[currentLang] || tDict['zh'];
            document.getElementById('confirm-modal-title').innerText = t.confirmTitle;
            document.getElementById('confirm-modal-msg').innerText = msg;
            overlay.style.display = 'flex';
            document.getElementById('confirm-btn-ok').innerText = t.btnOk;
            document.getElementById('confirm-btn-cancel').innerText = t.btnAbort;
            document.getElementById('confirm-btn-ok').onclick = () => { callback(); overlay.style.display = 'none'; };
            document.getElementById('confirm-btn-cancel').onclick = () => { overlay.style.display = 'none'; };
        };

        const startApp = async () => {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app); 
            db = getFirestore(app);
            
            window.logout = () => { sessionStorage.removeItem('active_staff_session'); location.reload(); };
            window.setLang = (l) => { currentLang = l; render(); };
            window.setTeacherFilter = (t) => { selectedTeacher = t; selectedClass = 'all'; selectedCategory = 'all'; render(); };
            window.setClassFilter = (c) => { selectedClass = c; selectedCategory = 'all'; render(); };
            window.setCategoryFilter = (cat) => { selectedCategory = selectedCategory === cat ? 'all' : cat; selectedClass = 'all'; render(); };
            window.setStatusFilter = (s) => { selectedStatus = s; render(); };
            window.toggleModal = (show) => { document.getElementById('modal-overlay').style.display = show ? 'flex' : 'none'; };
            window.toggleHistoryModal = (show) => { if (!show) window.cancelRecordEdit(); document.getElementById('history-modal-overlay').style.display = show ? 'flex' : 'none'; };
            window.toggleNotesModal = (show) => { document.getElementById('notes-modal-overlay').style.display = show ? 'flex' : 'none'; };

            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            
            await initAuth();
            if (!auth.currentUser) return; // Strict Guard

            const studentsCol = collection(db, 'artifacts', appId, 'public', 'data', 'students');
            onSnapshot(query(studentsCol), (snapshot) => {
                students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // 后台静默扫描：自动升级旧版数据格式
                students.forEach(s => {
                    let updates = {};
                    
                    // 历史老师名字清理
                    if (s.teacher === 'Anlaoshi') updates.teacher = 'Alaoshi';
                    if (s.teacher === 'Zenglaoshi') updates.teacher = 'Tanglaoshi';

                    // 历史班级名字自动清洗升级，永久保存回数据库
                    if (s.studentClass) {
                        const stdClass = getStandardClass(s.studentClass);
                        if (stdClass !== 'Other' && stdClass !== s.studentClass) {
                            updates.studentClass = stdClass;
                        }
                    }
                    
                    if (Object.keys(updates).length > 0) {
                        updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), updates);
                    }
                });

                render();
                if (currentHistoryStudentId && document.getElementById('history-modal-overlay').style.display === 'flex') {
                    window.openHistoryModal(currentHistoryStudentId);
                }
                if (currentNotesStudentId && document.getElementById('notes-modal-overlay').style.display === 'flex') {
                    window.openNotesModal(currentNotesStudentId);
                }
            }, (error) => {
                console.error("Firestore snapshot error:", error);
            });

            verifySession();

            const processAuth = () => {
                const name = document.getElementById('entry-name').value.trim();
                const pin = document.getElementById('entry-pin').value.trim();
                if (teacherPins[name] === pin) {
                    sessionStorage.setItem('active_staff_session', name);
                    verifySession();
                } else {
                    document.getElementById('auth-error').classList.remove('hidden');
                    setTimeout(() => document.getElementById('auth-error').classList.add('hidden'), 3000);
                }
            };

            document.getElementById('btn-enter').onclick = processAuth;
            document.getElementById('entry-pin').onkeypress = (e) => { if (e.key === 'Enter') processAuth(); };
            document.getElementById('entry-name').onkeypress = (e) => { if (e.key === 'Enter') processAuth(); };
        };

        const verifySession = () => {
            let saved = sessionStorage.getItem('active_staff_session');
            
            if (saved === 'Anlaoshi') {
                saved = 'Alaoshi'; sessionStorage.setItem('active_staff_session', 'Alaoshi');
            }
            if (saved === 'Zenglaoshi') {
                saved = 'Tanglaoshi'; sessionStorage.setItem('active_staff_session', 'Tanglaoshi');
            }

            if (saved && (teacherList.includes(saved) || saved === 'Director')) {
                loggedUser = saved; isAdmin = (saved === 'Director');
                document.getElementById('entry-gate').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('logged-user-name').innerText = isAdmin ? 'Director' : saved;
                document.getElementById('user-avatar').innerText = isAdmin ? 'D' : saved[0].toUpperCase();
                document.getElementById('teacher-filter-wrap').classList.toggle('hidden', !isAdmin);
                render();
            }
        };

        window.openNotesModal = (id) => {
            currentNotesStudentId = id;
            const s = students.find(item => item.id === id); if (!s) return;
            const t = tDict[currentLang] || tDict['zh'];
            
            document.getElementById('notes-modal-title').innerText = `${s.name} - ${t.notesTitle}`;
            document.getElementById('notes-input').placeholder = t.notesPlaceholder;
            document.getElementById('btn-add-note').innerText = t.btnAddNote;
            
            renderNotesList(s);
            window.toggleNotesModal(true);
            lucide.createIcons();
        };

        const renderNotesList = (s) => {
            const list = document.getElementById('notes-list');
            const t = tDict[currentLang] || tDict['zh'];
            list.innerHTML = '';
            
            const remarks = s.remarks || [];
            if (remarks.length === 0) {
                list.innerHTML = `<div class="py-8 text-center text-slate-400 italic text-sm font-medium">${t.notesEmpty}</div>`;
            } else {
                [...remarks].reverse().forEach(rm => {
                    list.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-2">
                            <div class="flex justify-between items-center border-b border-slate-50 pb-2">

                                <span class="text-[10px] font-bold text-slate-400">${rm.date}</span>
                            </div>
                            <p class="text-sm font-bold text-[#1A2E35] whitespace-pre-wrap">${rm.text}</p>
                        </div>
                    `;
                });
            }
        };

        window.addNote = async () => {
            const input = document.getElementById('notes-input');
            const text = input.value.trim();
            if (!text || !currentNotesStudentId) return;
            
            const s = students.find(it => it.id === currentNotesStudentId);
            if (!s) return;

            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            const newRemark = { author: loggedUser || 'Admin', date: dateStr, text: text };
            const updatedRemarks = [...(s.remarks || []), newRemark];
            
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', currentNotesStudentId), { 
                remarks: updatedRemarks
            });
            input.value = "";
        };

        window.copyContractNumber = () => {
            const container = document.getElementById('history-contract-container');
            const textToCopy = container.getAttribute('data-contract');
            if (!textToCopy) return;

            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            textArea.style.top = "0"; textArea.style.left = "0"; textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus(); textArea.select();
            try {
                document.execCommand('copy');
                const btn = document.getElementById('btn-copy-contract');
                btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-[#2C5F56]"></i>`;
                lucide.createIcons();
                setTimeout(() => { btn.innerHTML = `<i data-lucide="copy" class="w-3.5 h-3.5"></i>`; lucide.createIcons(); }, 2000);
            } catch (err) { console.error('Copy failed', err); }
            document.body.removeChild(textArea);
        };

        // 智能识别记录类型（扫描所有语言字典匹配对应的操作）
        const checkAction = (recordStr) => {
            if (!recordStr) return { type: 'normal', key: null };
            for (const lang of Object.keys(tDict)) {
                const dict = tDict[lang];
                if (recordStr.includes(dict.absentMark)) return { type: 'absent', key: 'absentMark', isBracketed: true };
                if (recordStr.includes(dict.trialMark)) return { type: 'trial', key: 'trialMark', isBracketed: true };
                if (recordStr.includes(`[${dict.actionFreeze}]`)) return { type: 'freeze', key: 'actionFreeze', isBracketed: false };
                if (recordStr.includes(`[${dict.actionUnfreeze}]`)) return { type: 'unfreeze', key: 'actionUnfreeze', isBracketed: false };
                if (recordStr.includes(`[${dict.actionArchive}]`)) return { type: 'archive', key: 'actionArchive', isBracketed: false };

            const dayIdx = new Date(dStr.replace(/-/g, "/")).getDay();
            const dayStr = t.days[dayIdx];
            
            const action = checkAction(record);
            let actionText = '';
            
            // Allow manual renewals string to bypass dict exact matches
            if (record.includes('续费')) {
                 return { text: record, type: 'normal', original: record }; 
            }

            if (action.key) {
                actionText = action.isBracketed ? ` ${t[action.key]}` : ` [${t[action.key]}]`;
            }

            return {
                text: `${dStr} (${dayStr})${actionText}`,
                type: action.type,

            };

                if (s.isArchived) {
                    st = {l: t.statusArchived, c: "bg-slate-100 text-slate-500 border-slate-200"};
                } else if (s.isFrozen) {
                    st = {l: t.statusFrozen, c: "bg-blue-50 text-blue-500 border-blue-200"};
                }
                
                const tableRowClass = s.isArchived ? 'bg-slate-50/50 grayscale opacity-80' : (s.isFrozen ? 'bg-blue-50/70' : '');
                const isTrial = sTot === 0;

                tbody.innerHTML += `
                    <tr class="table-row-modern transition-all duration-300 ${tableRowClass}">
                        <td class="px-8 py-7">
                            <div class="flex items-start gap-3">
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <span onclick="openNotesModal('${s.id}')" class="font-extrabold text-[#1A2E35] text-sm cursor-pointer hover:text-[#2C5F56] transition-colors border-b border-dashed border-[#2C5F56]/30 pb-0.5" title="${t.notesTitle}">
                                            ${s.name}
                                        </span>
                                        ${s.isFrozen && !s.isArchived ? '<i data-lucide="snowflake" class="w-3.5 h-3.5 text-blue-500"></i>' : ''}
                                        ${s.isArchived ? '<i data-lucide="archive" class="w-3.5 h-3.5 text-slate-400"></i>' : ''}
                                        <button onclick="openHistoryModal('${s.id}')" class="flex items-center gap-1.5 bg-[#F0F6F5] hover:bg-[#2C5F56] text-[#2C5F56] hover:text-white px-2.5 py-1 rounded-lg transition-all ml-1 shadow-sm group">
                                            <i data-lucide="history" class="w-3 h-3 group-hover:-rotate-12 transition-transform"></i>
                                            <span class="text-[9px] font-black tracking-widest uppercase">${t.btnHistory}</span>
                                        </button>
                                    </div>
                                    <div class="text-[10px] text-slate-400 font-medium tracking-tight uppercase">${s.contractId || '---'}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-8 py-7"><span class="bg-[#F0F6F5] text-[#2C5F56] px-4 py-2 rounded-2xl text-[9px] font-black uppercase tracking-wider shadow-sm border border-white">${s.teacher}</span></td>
                        <td class="px-8 py-7 font-bold text-slate-400 text-[11px] uppercase whitespace-nowrap tracking-wide">${displayClass}</td>
                        <td class="px-8 py-7 w-40"><div class="flex items-center gap-3"><span class="text-xs font-black ${rem<0?'text-rose-500':(isTrial?'text-purple-600':'text-slate-400')}">${sUsed}</span><div class="w-20 h-3 bg-slate-100 rounded-full overflow-hidden shadow-inner"><div class="h-full rounded-full ${rem<0?'bg-rose-600':(isTrial?'bg-purple-500':(rem<=3?'bg-[#FFC554]':'bg-[#2C5F56]'))}" style="width:${isTrial ? 100 : Math.min((sUsed/sTot)*100,100)}%"></div></div></div></td>
                        <td class="px-8 py-7 font-[900] ${rem<0?'text-rose-500':(isTrial?'text-purple-600':'text-[#1A2E35]')} text-xl tracking-tight">${isTrial ? '---' : rem}</td>
                        <td class="px-8 py-7 text-slate-400 text-xs font-bold text-center italic">${s.lastPaymentDate || '---'}</td>
                        <td class="px-8 py-7 text-center"><span class="px-4 py-2 rounded-full text-[9px] font-black border border-white whitespace-nowrap shadow-sm uppercase tracking-widest ${st.c}">${st.l}</span></td>
                        <td class="px-8 py-7 text-right whitespace-nowrap w-[300px]">
                            <div class="flex justify-end gap-1.5 items-center">
                                ${isTrial ? `
                                    <button onclick="markTrial('${s.id}')" class="bg-purple-500 text-white text-[9px] font-black px-4 py-2.5 rounded-full active:scale-95 transition-all shadow-lg shadow-purple-500/20 uppercase ${s.isFrozen || s.isArchived ? 'opacity-50 cursor-not-allowed' : 'hover:bg-purple-600'}" title="${t.actionTrial}" ${s.isFrozen || s.isArchived ? 'disabled' : ''}>
                                        <i data-lucide="headphones" class="w-3 h-3 inline-block -mt-0.5 mr-1"></i>${t.actionTrial}
                                    </button>
                                ` : `
                                    <button onclick="updateLesson('${s.id}')" class="bg-[#2C5F56] text-white text-[9px] font-black px-3 py-2.5 rounded-full active:scale-95 transition-all shadow-lg shadow-[#2C5F56]/10 uppercase ${s.isFrozen || s.isArchived || isTrial ? 'opacity-50 cursor-not-allowed' : ''}" title="${t.actionPlus}" ${s.isFrozen || s.isArchived || isTrial ? 'disabled' : ''}>${t.actionPlus}</button>
                                    <button onclick="markAbsent('${s.id}')" class="bg-amber-100 text-amber-700 text-[9px] font-black px-3 py-2.5 rounded-full active:scale-95 transition-all shadow-sm border border-amber-200 uppercase ${s.isFrozen || s.isArchived || isTrial ? 'opacity-50 cursor-not-allowed' : 'hover:bg-amber-200'}" title="${t.actionAbsent}" ${s.isFrozen || s.isArchived || isTrial ? 'disabled' : ''}>
                                        <i data-lucide="user-x" class="w-3.5 h-3.5 inline-block -mt-0.5"></i>
                                    </button>
                                `}
                                <div class="w-px h-5 bg-slate-200 mx-1"></div>
                                <button onclick="toggleFreeze('${s.id}')" class="p-2.5 bg-white ${s.isFrozen ? 'text-orange-500 hover:text-orange-600' : 'text-blue-500 hover:text-blue-600'} rounded-xl transition-all shadow-sm border border-slate-50 ${s.isArchived ? 'opacity-50 cursor-not-allowed' : ''}" title="${s.isFrozen ? t.actionUnfreeze : t.actionFreeze}" ${s.isArchived ? 'disabled' : ''}><i data-lucide="${s.isFrozen ? 'flame' : 'snowflake'}" class="w-4 h-4"></i></button>
                                <button onclick="toggleArchive('${s.id}')" class="p-2.5 bg-white ${s.isArchived ? 'text-emerald-500 hover:text-emerald-600' : 'text-slate-900 hover:text-black'} rounded-xl transition-all shadow-sm border border-slate-50" title="${s.isArchived ? t.actionUnarchive : t.actionArchive}"><i data-lucide="${s.isArchived ? 'archive-restore' : 'archive'}" class="w-4 h-4"></i></button>
                                <div class="w-px h-5 bg-slate-200 mx-1"></div>
                                <button onclick="openEditModal('${s.id}')" class="p-2.5 bg-white text-slate-300 hover:text-[#2C5F56] rounded-xl transition-all shadow-sm border border-slate-50" title="编辑"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="deleteStudent('${s.id}')" class="p-2.5 bg-white text-slate-300 hover:text-rose-500 rounded-xl shadow-sm border border-slate-50" title="删除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            document.getElementById('label-name').innerText = t.labelName;
            document.getElementById('label-contract').innerText = t.labelContract; 
            document.getElementById('input-contract').placeholder = t.placeholderContract;
            document.getElementById('input-name').placeholder = t.placeholderName;
            document.getElementById('label-teacher').innerText = t.labelTeacher; 
            document.getElementById('label-class').innerText = t.labelClass;
            document.getElementById('input-class').placeholder = t.placeholderClass;
            document.getElementById('label-total').innerText = t.labelTotal; 
            document.getElementById('label-used').innerText = t.labelUsed;
            document.getElementById('label-add').innerText = t.labelAdd;
            document.getElementById('label-date').innerText = t.labelPayDate; 
            document.getElementById('btn-cancel').innerText = t.btnCancel;
            document.getElementById('btn-save').innerText = t.btnSave; 
            document.getElementById('btn-close-history').innerText = t.btnClose;
            document.getElementById('filter-label').innerText = t.filterLabel; 
            document.getElementById('filter-class-label').innerText = t.filterClassLabel;
            document.getElementById('filter-status-label').innerText = t.filterStatusLabel;
            lucide.createIcons();
        };

        // Bootstrap the application
        startApp();
    </script>
</body>
</html>
